# Every night: fetches box art for entries that don't have a cover yet,
# refreshes the GitHub stars, last push and latest release in data/recomps.js,
# works out which operating systems new entries and new releases run on,
# hides projects whose repository hands out game files (and shows them again once it stops),
# recounts each project's new stars over the last 7 days and visitors over the
# last 3 (the front page's Trending releases, so it changes every night), posts new releases
# to Discord (once a webhook is set up), and commits whatever changed. Stages, genres and quality tiers stay manual:
# the job summary lists new covers to check and entries worth a look.
#
# Pushes made with GITHUB_TOKEN don't start other workflows, so
# deploy-pages.yml also runs on `workflow_run` of "Refresh data".
name: Refresh data

on:
  schedule:
    - cron: '23 4 * * *'   # 04:23 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  discussions: read   # for the user scores (tools/track_ratings.py)

concurrency:
  group: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Fetch missing covers
        run: python tools/fetch_covers.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Refresh GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/refresh_stats.py --summary "$GITHUB_STEP_SUMMARY"

      # After the stats, so a new push or release gets a fresh look. Hides projects whose repository
      # or latest release hands out the game itself, and shows them again once it stops.
      - name: Check repositories for game files
        run: python tools/check_roms.py --summary "$GITHUB_STEP_SUMMARY"

      # After the stats, so a new release tag triggers a fresh look at its downloads.
      - name: Detect platforms for new entries and new releases
        run: python tools/detect_platforms.py

      # After the platforms, so a system that now has a download stops counting as planned.
      - name: Detect the systems projects say are coming next
        run: python tools/detect_planned.py

      - name: Detect the languages each game can be played in
        run: python tools/detect_languages.py

      - name: Detect keyboard/mouse support and mod managers for new entries
        run: python tools/detect_features.py

      - name: Count this week's new stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/track_stars.py --summary "$GITHUB_STEP_SUMMARY"

      # Does nothing until GoatCounter is set up (README: "Counting visits").
      - name: Count this week's visitors
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python tools/track_visits.py --summary "$GITHUB_STEP_SUMMARY"

      # Does nothing until comments are set up (README: "Ratings and comments").
      - name: Average the user scores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/track_ratings.py --summary "$GITHUB_STEP_SUMMARY"

      # Does nothing until the repo has a DISCORD_WEBHOOK_URL secret (see the script).
      - name: Post new releases to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tools/announce_releases.py

      - name: Commit the data and covers if they changed
        run: |
          if [ -z "$(git status --porcelain -- data/recomps.js data/stars-history.json data/rom-checks.json data/planned-checks.json data/language-checks.json assets/covers)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recomps.js data/stars-history.json data/rom-checks.json data/planned-checks.json data/language-checks.json assets/covers
          git commit -m "Refresh GitHub stats and covers ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
