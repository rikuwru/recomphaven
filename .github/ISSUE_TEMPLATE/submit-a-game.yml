name: Submit a game
description: Suggest a recomp, decomp or native port that's missing from Recomp Haven, or a correction to one that's listed.
title: "[Submission]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep Recomp Haven complete. Every submission is checked by hand before it goes on the site.

        ### Only true recompilations and decompilations are listed

        Recomp Haven lists projects that translate a game's own code into a native program (static recompilation), rebuild its source code (decompilation or disassembly), or are native ports built from those. **These aren't recomps, so they won't be added:**

        - **PS4 and PS5 "PC ports"** such as Bloodborne PC, inFAMOUS Second Son and Shadow of the Colossus (PS4). Those consoles already run x86-64 code, so these projects run the game's original code through a compatibility layer, much like an emulator: nothing is recompiled.
        - **Emulators**, and ports or launchers built on an emulator.
        - **Source ports** of games whose source code was released or leaked, such as dhewm3 for Doom 3.
        - **Remakes** that rebuild a game from scratch instead of translating or decompiling it.

        Hand-made ports that reimplement a game's engine, like the P.T. PC port, are the exception: they can be listed.

  - type: checkboxes
    id: true-recomp
    attributes:
      label: Is it a true recomp or decomp?
      options:
        - label: It translates, decompiles or reimplements the game's own code. It isn't a PS4 or PS5 compatibility-layer port, an emulator, a source port or a remake.
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: What are you submitting?
      options:
        - A missing recompilation
        - A missing decompilation or native port
        - A correction to a game that's already listed
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Project link
      description: The project's GitHub or GitLab page, or its website.
      placeholder: https://github.com/owner/project
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game
      placeholder: "Viva Piñata: Trouble in Paradise"
    validations:
      required: true

  - type: input
    id: console
    attributes:
      label: Original console
      placeholder: Xbox 360

  - type: dropdown
    id: stage
    attributes:
      label: How far along is it?
      options:
        - Released (stable, playable start to finish)
        - Playable beta
        - In development (boots or partly works)
        - Early work, not playable yet
        - Not sure

  - type: dropdown
    id: role
    attributes:
      label: Are you involved with the project?
      options:
        - Yes, I work on it
        - No

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Which systems it runs on, features like widescreen, mods or keyboard and mouse, or what's wrong in an existing entry.
